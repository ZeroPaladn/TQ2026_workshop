name: Self-Heal Failing PR Tests

# Runs after "Playwright Tests" finishes on a pull request. If it failed, asks
# GitHub Copilot coding agent to fix the tests and push a commit to the PR
# branch. Limited to one attempt per PR and to PRs from this repo (not forks),
# since workflow_run only reports pull_requests for same-repo branches.
on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  self-heal:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve associated pull request
        id: pr
        run: |
          PR_NUMBER=$(echo '${{ toJson(github.event.workflow_run.pull_requests) }}' | jq -r '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No same-repo pull request for this run (likely a fork PR); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for prior self-heal attempt
        id: guard
        if: steps.pr.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -qx "self-heal-attempted"; then
            echo "Self-heal already attempted for this PR; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Copilot fix
        if: steps.pr.outputs.should_run == 'true' && steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "@copilot The **Playwright Tests** workflow failed on this PR: https://github.com/$REPO/actions/runs/$RUN_ID

          Please investigate the failing test(s) and push a fix as a commit to this branch. Only change test automation code (Page Objects, tests, fixtures, config) to address the root cause of the failure — do not mask failures with retries or arbitrary waits. Follow the conventions in AGENTS.md and .github/copilot-instructions.md.

          This is an automated one-time self-heal request; further failures on this PR will require manual attention."

          gh label create "self-heal-attempted" --repo "$REPO" --color "ededed" --description "Automated self-heal has already been requested for this PR" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "self-heal-attempted"
